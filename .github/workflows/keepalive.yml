name: Keepalive

# Evita que Supabase pause la base por inactividad: cada 3 días consulta
# /healthz/, que ejecuta SELECT 1. La URL se define como variable de
# repositorio HEALTHCHECK_URL (Settings → Secrets and variables → Actions →
# Variables). Si no está definida, el job termina sin fallar.
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Consultar /healthz/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
    steps:
      - name: GET /healthz/
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL no está definida; no hay nada que consultar."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            "$HEALTHCHECK_URL"
