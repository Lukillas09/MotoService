name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Django sobre PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: motoservice
          POSTGRES_PASSWORD: motoservice
          POSTGRES_DB: motoservice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motoservice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      # Base descartable del service de este job. Los tests nunca leen DATABASE_URL.
      TEST_DATABASE_URL: postgres://motoservice:motoservice@localhost:5432/motoservice
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Checks de Django
        run: python manage.py check

      - name: Checks de despliegue con settings de producción
        env:
          # Valores ficticios: sólo permiten importar config.settings.production.
          SECRET_KEY: ci-only-dummy-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci_dummy
          ALLOWED_HOSTS: motoservice.example.test
          CSRF_TRUSTED_ORIGINS: https://motoservice.example.test
          BREVO_API_KEY: ci-dummy-brevo-api-key
          BREVO_FROM_EMAIL: ci@example.test
          BREVO_FROM_NAME: MotoService CI
        run: python manage.py check --deploy --settings=config.settings.production

      - name: Confirmar que los tests usan PostgreSQL
        run: >-
          python manage.py shell -c
          "from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor"

      - name: Tests
        run: python manage.py test --noinput
