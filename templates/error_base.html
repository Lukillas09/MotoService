{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#075ee5">
  <link rel="icon" href="{% static 'icons/favicon-32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
  <title>{% block title %}Error | MotoService{% endblock %}</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;color:#0c1d38;background:radial-gradient(circle at 15% 10%,#dceaff 0,transparent 28rem),#f4f7fb}main{display:grid;min-height:100vh;padding:1.5rem;place-items:center}.error-card{width:min(35rem,100%);padding:clamp(2rem,6vw,3.5rem);text-align:center;background:#fff;border:1px solid #dfe7f2;border-radius:1.25rem;box-shadow:0 1.2rem 3rem rgba(25,55,95,.12)}.brand{display:inline-flex;margin-bottom:2rem;align-items:center;gap:.7rem;color:#0b2350;font-size:1.25rem;font-weight:850}.brand-mark{display:block;width:2.7rem;height:2.7rem;object-fit:contain;filter:drop-shadow(0 .3rem .45rem rgba(7,94,229,.18))}.brand em{color:#075ee5;font-style:normal}.code{margin:0 0 .55rem;color:#075ee5;font-size:.78rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase}h1{margin:0 0 1rem;font-size:clamp(1.8rem,6vw,2.6rem);letter-spacing:-.04em}p{margin:0 auto 1.7rem;max-width:27rem;color:#60738e;line-height:1.6}a{display:inline-block;min-height:2.75rem;padding:.75rem 1.15rem;color:#fff;text-decoration:none;background:#075ee5;border-radius:.72rem;box-shadow:0 .5rem 1rem rgba(7,94,229,.2);font-weight:750}a:hover{background:#064dbd}a:focus-visible{outline:.2rem solid #8bbcff;outline-offset:.2rem}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <section class="error-card">
      <div class="brand"><img class="brand-mark" src="{% static 'icons/motoservice-mark-96.png' %}" alt=""><span>Moto<em>Service</em></span></div>
      <div class="code">{% block code %}{% endblock %}</div>
      <h1>{% block heading %}{% endblock %}</h1>
      <p>{% block message %}{% endblock %}</p>
      {% block action %}<a href="/">Volver al inicio</a>{% endblock %}
    </section>
  </main>
</body>
</html>
