<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f4f7fb;color:#0c1d38;font-family:Arial,sans-serif">
  <div style="max-width:560px;margin:auto;padding:32px;background:#fff;border:1px solid #dfe7f2;border-radius:16px">
    <h1 style="font-size:24px;margin:0 0 16px">Recuperá tu acceso a MotoService</h1>
    <p>Hola{% if user.first_name %} {{ user.first_name }}{% endif %},</p>
    <p>Recibimos una solicitud para cambiar la contraseña de tu cuenta.</p>
    <p style="margin:28px 0"><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:13px 20px;color:#fff;background:#075ee5;border-radius:10px;text-decoration:none;font-weight:bold">Elegir nueva contraseña</a></p>
    <p style="color:#60738e">El enlace vence en 24 horas. Si no solicitaste el cambio, podés ignorar este mensaje.</p>
  </div>
</body>
</html>
